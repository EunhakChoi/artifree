name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
          - os: windows-2025
            node: '22.22.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Reject generated changes
        run: git diff --exit-code -- contracts packages/contracts/src/generated docs/architecture.html package-lock.json Cargo.lock

  msrv:
    name: Rust minimum version (1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.85.0 test --workspace --all-features --locked

  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      ARTIFREE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:smoke
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}
          path: .artifree/qa/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependencies and workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node scripts/install-ci-tools.mjs
      - run: .artifree/tools/actionlint
      - run: .artifree/tools/cargo-deny --locked check

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [checks, msrv, browsers, dependencies]
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            assert.equal(job.result, 'success', `Required job failed, skipped, or cancelled: ${name}`);
          }
          console.log('All required verification jobs passed.');
          NODE
