name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Cold Windows builds now compile bundled SQLite, Tokio, and Axum, and the
    # tooling tests build and spawn the server.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
          - os: windows-2025
            node: '22.22.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Reject generated changes
        run: git diff --exit-code -- contracts packages/contracts/src/generated docs/architecture.html package-lock.json Cargo.lock

  msrv:
    name: Rust minimum version (1.88.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.88.0 test --workspace --all-features --locked

  server-binary:
    name: Server binary for browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server-binary
      - run: cargo build --locked -p artifree-server --bin artifree-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifree-server-linux
          path: target/debug/artifree-server
          if-no-files-found: error
          retention-days: 1

  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image has no Rust toolchain. Ubuntu 24.04 runner and the
    # noble image share glibc, so the runner-built binary runs in the container.
    needs: [server-binary]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      ARTIFREE_BROWSER: ${{ matrix.browser }}
      # Relative to the checkout; github.workspace is a host path in containers.
      ARTIFREE_SERVER_BIN: .artifree/bin/artifree-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifree-server-linux
          path: .artifree/bin
      - run: chmod +x .artifree/bin/artifree-server
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}
          path: .artifree/qa/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Release archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A cold release build compiles the whole server with optimizations.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
            target: linux-x64
            rustflags: '-D warnings'
          - os: windows-2025
            node: '22.22.2'
            target: windows-x64
            # Link the C runtime statically so the archive runs on a machine
            # without the Visual C++ redistributable (decision 0025).
            rustflags: '-D warnings -C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-release.mjs --target ${{ matrix.target }} --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  install:
    name: Clean install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
            target: linux-x64
          - os: windows-2025
            node: '22.22.2'
            target: windows-x64
    steps:
      # Only the verifier script is checked out. It uses Node built-ins and
      # runs the unpacked archive; no npm install and no Rust build happen in
      # this job, and the unpacked package runs with an empty PATH.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: release
      - run: node scripts/verify-release.mjs release

  dependencies:
    name: Dependencies and workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node scripts/install-ci-tools.mjs
      - run: .artifree/tools/actionlint
      - run: .artifree/tools/cargo-deny --locked check

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      [checks, msrv, server-binary, browsers, package, install, dependencies]
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            assert.equal(job.result, 'success', `Required job failed, skipped, or cancelled: ${name}`);
          }
          console.log('All required verification jobs passed.');
          NODE
