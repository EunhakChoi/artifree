name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Cold Windows builds now compile bundled SQLite, Tokio, and Axum, and the
    # tooling tests build and spawn the server.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
          - os: windows-2025
            node: '22.22.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned cargo-nextest (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          # Must match nextest-version in .config/nextest.toml.
          nextest_version=0.9.149
          nextest_sha256=32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
          nextest_asset="cargo-nextest-${nextest_version}-x86_64-unknown-linux-gnu.tar.gz"
          nextest_archive="$RUNNER_TEMP/$nextest_asset"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$nextest_archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${nextest_version}/$nextest_asset"
          echo "$nextest_sha256  $nextest_archive" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$nextest_archive" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version
      - name: Install pinned cargo-nextest (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # Must match nextest-version in .config/nextest.toml.
          $nextestVersion = '0.9.149'
          $nextestSha256 = 'bf904b85c7c5c2a29c340053a8d9d8e8027ff0d55a2bf7cef7d23032f8166438'
          $nextestAsset = "cargo-nextest-$nextestVersion-x86_64-pc-windows-msvc.zip"
          $nextestArchive = Join-Path $env:RUNNER_TEMP $nextestAsset
          Invoke-WebRequest -Uri "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$nextestVersion/$nextestAsset" -OutFile $nextestArchive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $nextestArchive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $nextestSha256) { throw "cargo-nextest archive checksum mismatch: $actualSha256" }
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          New-Item -ItemType Directory -Force -Path $cargoBin | Out-Null
          Expand-Archive -LiteralPath $nextestArchive -DestinationPath $cargoBin -Force
          cargo nextest --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Reject generated changes
        run: git diff --exit-code -- contracts packages/contracts/src/generated docs/architecture.html package-lock.json Cargo.lock

  msrv:
    name: Rust minimum version (1.89.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.89.0 test --workspace --all-features --locked

  server-binary:
    name: Server binary for browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server-binary
      - run: cargo build --locked -p artifree-server --bin artifree-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifree-server-linux
          path: target/debug/artifree-server
          if-no-files-found: error
          retention-days: 1

  browsers:
    name: Browser (${{ matrix.browser }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image has no Rust toolchain. Ubuntu 24.04 runner and the
    # noble image share glibc, so the runner-built binary runs in the container.
    needs: [server-binary]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        # Both engines, see docs/quality.md "Browser engines". The release
        # workflow refuses a tag when Firefox is missing from this list.
        browser: [chromium, firefox]
        # The two shards of scripts/smoke.mjs; together they run the whole suite.
        shard: [outbox, ui]
    env:
      ARTIFREE_BROWSER: ${{ matrix.browser }}
      ARTIFREE_SMOKE_SHARD: ${{ matrix.shard }}
      # Relative to the checkout; github.workspace is a host path in containers.
      ARTIFREE_SERVER_BIN: .artifree/bin/artifree-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifree-server-linux
          path: .artifree/bin
      - run: chmod +x .artifree/bin/artifree-server
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: .artifree/qa/${{ matrix.browser }}-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Release archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A cold release build compiles the whole server with optimizations.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
            target: linux-x64
            rustflags: '-D warnings'
          - os: windows-2025
            node: '22.22.2'
            target: windows-x64
            # Link the C runtime statically so the archive runs on a machine
            # without the Visual C++ redistributable (decision 0025).
            rustflags: '-D warnings -C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-release.mjs --target ${{ matrix.target }} --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  install:
    name: Clean install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.12.0'
            target: linux-x64
          - os: windows-2025
            node: '22.22.2'
            target: windows-x64
    steps:
      # Only the verifier script is checked out. It uses Node built-ins and
      # runs the unpacked archive; no npm install and no Rust build happen in
      # this job, and the unpacked package runs with an empty PATH.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: release
      - run: node scripts/verify-release.mjs release

  container:
    name: Container image (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [package]
    steps:
      # Only scripts/ and the Dockerfile are checked out. The image is built
      # from the release archive of the package job (decision 0026), and the
      # verifier uses Node built-ins and the runner's Docker.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            deploy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x64
          path: release
      - run: node scripts/verify-container.mjs release

  debian-12:
    name: Debian 12 (glibc 2.36) runs the archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [package]
    steps:
      # The glibc floor of decision 0037. The ELF check needs only Node. The
      # verifier then runs the unpacked server inside Debian 12 (the official
      # Node image, pinned by digest) with no network, a read-only root, and
      # only scripts/ and the archive mounted read-only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x64
          path: release
      - run: node scripts/check-glibc.mjs release/artifree-*-linux-x64.tar.gz
      - name: Verify the archive on Debian 12
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,size=512m \
            --volume "$PWD/scripts:/work/scripts:ro" \
            --volume "$PWD/release:/work/release:ro" \
            --workdir /work \
            node:22.12.0-bookworm-slim@sha256:35531c52ce27b6575d69755c73e65d4468dba93a25644eed56dc12879cae9213 \
            sh -c 'node scripts/check-glibc.mjs --runtime && node scripts/verify-release.mjs release'

  dependencies:
    name: Dependencies and workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node scripts/install-ci-tools.mjs
      - run: .artifree/tools/actionlint
      - run: .artifree/tools/cargo-deny --locked check

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      [
        checks,
        msrv,
        server-binary,
        browsers,
        package,
        install,
        container,
        debian-12,
        dependencies,
      ]
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            assert.equal(job.result, 'success', `Required job failed, skipped, or cancelled: ${name}`);
          }
          console.log('All required verification jobs passed.');
          NODE
