version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patch-and-minor:
        update-types: [minor, patch]
    ignore:
      # Node types must match the oldest supported runtime (`engines`), or
      # type checks accept APIs that Node 22 lacks. Lift this when raising it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patch-and-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
