[package]
name = "artifree-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
artifree-domain.workspace = true
artifree-ports.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
sha2.workspace = true

# Linux targets only (decision 0056 rules 1 and 7).
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
rustix.workspace = true
seccompiler.workspace = true

# The payload example of the enforcement job only; no library code uses it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
signal-hook.workspace = true
# `kill(-1, SIGKILL)` for the payload's host scenario, which rustix does not offer (0056,
# amendment of 2026-11-13). Only test targets enable the feature; the library keeps `sched`.
nix = { workspace = true, features = ["signal"] }

# Decision 0057 rule 2: the fixture profile and the worker's launch, for the Linux enforcement job
# only. Release archives, the container image and the clean-install checks build without it, and
# scripts/check-boundaries.mjs fails when one of their build commands names it.
[features]
enforcement-fixture = []

[lints]
workspace = true
