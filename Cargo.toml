[workspace]
members = [
    "crates/artifree-domain",
    "crates/artifree-core",
    "crates/artifree-ports",
    "crates/artifree-providers",
    "crates/artifree-contracts",
    "crates/artifree-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/EunhakChoi/artifree"

[workspace.dependencies]
artifree-domain = { path = "crates/artifree-domain", version = "=0.1.0" }
artifree-core = { path = "crates/artifree-core", version = "=0.1.0" }
artifree-ports = { path = "crates/artifree-ports", version = "=0.1.0" }
artifree-providers = { path = "crates/artifree-providers", version = "=0.1.0" }
artifree-contracts = { path = "crates/artifree-contracts", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1"
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.4"
# Decision 0056 rule 7: the Linux execution provider's system calls, through safe
# interfaces only, pinned, with the features reduced to what the bootstrap uses.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "thread", "stdio"] }
seccompiler = { version = "=0.5.0", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time", "fs", "io-util", "process"] }
base64 = "0.23"
# The PNG validator depends on exact decoder and inflater behavior (decision 0045,
# rule 3), so these two are pinned exactly: a bump is a reviewed change.
png = "=0.18.1"
miniz_oxide = "=0.8.9"
crc32fast = "1.5"
# JPEG admission (decision 0045, rule 3): the maintained decoder that runs after
# the Artifree-owned walker. Pinned exactly, without default features, so
# unsafe SIMD code stays disabled and a bump is a reviewed change.
zune-jpeg = { version = "=0.5.15", default-features = false }
http-body = "1"
futures-core = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
wildcard_imports = "deny"
