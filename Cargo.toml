[workspace]
members = [
    "crates/artifree-domain",
    "crates/artifree-core",
    "crates/artifree-ports",
    "crates/artifree-providers",
    "crates/artifree-contracts",
    "crates/artifree-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/EunhakChoi/artifree"

[workspace.dependencies]
artifree-domain = { path = "crates/artifree-domain", version = "=0.1.0" }
artifree-core = { path = "crates/artifree-core", version = "=0.1.0" }
artifree-ports = { path = "crates/artifree-ports", version = "=0.1.0" }
artifree-providers = { path = "crates/artifree-providers", version = "=0.1.0" }
artifree-contracts = { path = "crates/artifree-contracts", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time"] }
base64 = "0.23"
http-body = "1"
futures-core = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
wildcard_imports = "deny"
