[workspace]
members = [
    "crates/artifree-domain",
    "crates/artifree-core",
    "crates/artifree-ports",
    "crates/artifree-providers",
    "crates/artifree-contracts",
    "crates/artifree-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/EunhakChoi/artifree"

[workspace.dependencies]
artifree-domain = { path = "crates/artifree-domain" }
artifree-core = { path = "crates/artifree-core" }
artifree-ports = { path = "crates/artifree-ports" }
artifree-providers = { path = "crates/artifree-providers" }
artifree-contracts = { path = "crates/artifree-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
